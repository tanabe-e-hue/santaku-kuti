<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3択自動読み上げ選択ツール（写真・動画・削除機能対応版）</title>

  <!-- MediaPipe Face Mesh ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
    }

    /* 1. 設定画面 */
    #setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100%;
      padding: 20px;
      overflow-y: auto;
    }
    .input-container {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      width: 95%;
      max-width: 1100px;
    }
    .input-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .input-box label {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }
    .input-box textarea {
      height: 60px;
      font-size: 1rem;
      padding: 8px;
      border: 2px solid #ccc;
      border-radius: 8px;
      resize: none;
      margin-bottom: 10px;
    }
    .media-select {
      margin-bottom: 12px;
      font-size: 0.85rem;
      background: #f9f9f9;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #eee;
    }
    .media-select-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .media-select input[type="text"], 
    .media-select input[type="file"] {
      flex: 1;
      font-size: 0.85rem;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
    }
    /* 削除ボタン */
    .clear-btn {
      padding: 4px 10px;
      font-size: 0.8rem;
      background-color: #ff3b30;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .clear-btn:hover {
      background-color: #d70015;
    }
    .start-btn {
      padding: 15px 40px;
      font-size: 1.4rem;
      font-weight: bold;
      color: white;
      background-color: #007aff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    /* 2. 選択画面 */
    #selection-screen {
      display: none;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    .split-area {
      display: flex;
      width: 100%;
      height: 100%;
    }
    .one-third {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px dashed #ccc;
      background-color: #ffffff;
      padding: 10px;
    }
    .one-third:last-child {
      border-right: none;
    }

    .option-box {
      width: 300px;
      height: 260px;
      max-width: 95%;
      max-height: 85%;
      border: 4px solid #ccc;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
      background-color: #fafafa;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: all 0.2s ease-in-out;
      overflow: hidden;
      position: relative;
    }

    .option-media-preview {
      width: 100%;
      height: 70%;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .option-box.active {
      border: 8px solid #ff9500;
      background-color: #fff3e0;
      box-shadow: 0 0 20px rgba(255, 149, 0, 0.6);
      transform: scale(1.03);
    }

    .option-box.selected {
      border: 10px solid #34c759 !important;
      background-color: #e8f5e9 !important;
      color: #1b5e20 !important;
      box-shadow: 0 0 25px rgba(52, 199, 89, 0.8) !important;
      transform: scale(1.05);
    }

    /* カメラプレビュー */
    #camera-preview {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 180px;
      height: 135px;
      border-radius: 8px;
      border: 4px solid #007aff;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 10;
      background: #000;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    #camera-preview.mouth-open-detected {
      border-color: #ff3b30 !important;
      box-shadow: 0 0 20px rgba(255, 59, 48, 0.9);
    }

    /* 状態インジケーター */
    #status-msg {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: bold;
      z-index: 10;
      text-align: center;
      transition: background-color 0.2s;
    }

    /* 3. 決定完了＆メディア大画面表示 */
    #result-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    #result-text {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 15px;
      text-align: center;
    }
    
    /* 大画面メディア表示エリア */
    .media-container {
      width: 80vw;
      max-width: 900px;
      height: 55vh;
      max-height: 550px;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-container iframe, 
    .media-container video, 
    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: none;
    }

    .reset-btn {
      padding: 12px 30px;
      font-size: 1.2rem;
      background-color: #34c759;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 非表示のビデオ要素 -->
  <video id="input-video" style="display:none;" playsinline muted></video>

  <!-- 1. 設定画面 -->
  <div id="setup-screen">
    <h1 style="margin-bottom: 20px;">3択の内容・写真・動画を設定してください</h1>
    <div class="input-container">
      
      <!-- 左選択肢 -->
      <div class="input-box">
        <label for="left-text">左側 (選択肢 1)</label>
        <textarea id="left-text" placeholder="例: お茶 / 電車">電車</textarea>
        
        <div class="media-select">
          <label>写真/画像ファイル:</label>
          <div class="media-select-row">
            <input type="file" id="left-img-file" accept="image/*">
            <button class="clear-btn" onclick="clearInput('left-img-file')">削除</button>
          </div>
        </div>
        <div class="media-select">
          <label>動画ファイル:</label>
          <div class="media-select-row">
            <input type="file" id="left-video-file" accept="video/*">
            <button class="clear-btn" onclick="clearInput('left-video-file')">削除</button>
          </div>
        </div>
        <div class="media-select">
          <label>YouTube URL:</label>
          <div class="media-select-row">
            <input type="text" id="left-url" placeholder="https://www.youtube.com/watch?v=...">
            <button class="clear-btn" onclick="clearInput('left-url')">削除</button>
          </div>
        </div>
      </div>

      <!-- 中央選択肢 -->
      <div class="input-box">
        <label for="center-text">中央 (選択肢 2)</label>
        <textarea id="center-text" placeholder="例: お水 / 音楽">音楽</textarea>
        
        <div class="media-select">
          <label>写真/画像ファイル:</label>
          <div class="media-select-row">
            <input type="file" id="center-img-file" accept="image/*">
            <button class="clear-btn" onclick="clearInput('center-img-file')">削除</button>
          </div>
        </div>
        <div class="media-select">
          <label>動画ファイル:</label>
          <div class="media-select-row">
            <input type="file" id="center-video-file" accept="video/*">
            <button class="clear-btn" onclick="clearInput('center-video-file')">削除</button>
          </div>
        </div>
        <div class="media-select">
          <label>YouTube URL:</label>
          <div class="media-select-row">
            <input type="text" id="center-url" placeholder="https://www.youtube.com/watch?v=...">
            <button class="clear-btn" onclick="clearInput('center-url')">削除</button>
          </div>
        </div>
      </div>

      <!-- 右選択肢 -->
      <div class="input-box">
        <label for="right-text">右側 (選択肢 3)</label>
        <textarea id="right-text" placeholder="例: ジュース / 動物">動物</textarea>
        
        <div class="media-select">
          <label>写真/画像ファイル:</label>
          <div class="media-select-row">
            <input type="file" id="right-img-file" accept="image/*">
            <button class="clear-btn" onclick="clearInput('right-img-file')">削除</button>
          </div>
        </div>
        <div class="media-select">
          <label>動画ファイル:</label>
          <div class="media-select-row">
            <input type="file" id="right-video-file" accept="video/*">
            <button class="clear-btn" onclick="clearInput('right-video-file')">削除</button>
          </div>
        </div>
        <div class="media-select">
          <label>YouTube URL:</label>
          <div class="media-select-row">
            <input type="text" id="right-url" placeholder="https://www.youtube.com/watch?v=...">
            <button class="clear-btn" onclick="clearInput('right-url')">削除</button>
          </div>
        </div>
      </div>

    </div>
    <button class="start-btn" onclick="initCameraAndStart()">カメラ起動 & 口あけ選択スタート</button>
  </div>

  <!-- 2. 選択画面 -->
  <div id="selection-screen">
    <div id="status-msg">カメラ初期化中...</div>
    <div class="split-area">
      <div class="one-third">
        <div id="box-left" class="option-box"></div>
      </div>
      <div class="one-third">
        <div id="box-center" class="option-box"></div>
      </div>
      <div class="one-third">
        <div id="box-right" class="option-box"></div>
      </div>
    </div>
    <video id="camera-preview" autoplay playsinline muted></video>
  </div>

  <!-- 3. 決定完了＆写真・動画再生画面 -->
  <div id="result-screen">
    <div id="result-text"></div>
    <div id="media-wrapper" class="media-container" style="display:none;">
      <!-- JavaScriptで画像/動画/YouTubeを動的に差し替え -->
    </div>
    <button class="reset-btn" onclick="resetApp()">もう一度設定する</button>
  </div>

  <script>
    let options = ["", "", ""];
    let mediaData = [
      { type: null, src: null },
      { type: null, src: null },
      { type: null, src: null }
    ];
    let currentIndex = 0;
    let intervalId = null;
    let isSelected = false;
    let canSelect = false;

    const synth = window.speechSynthesis;
    let maleVoice = null;

    // 入力項目クリア処理関数
    function clearInput(elementId) {
      const elem = document.getElementById(elementId);
      if (elem) {
        elem.value = "";
      }
    }

    function loadVoices() {
      const voices = synth.getVoices();
      const jaVoices = voices.filter(v => v.lang.includes('ja'));
      maleVoice = jaVoices.find(v => 
        v.name.includes('Keita') || 
        v.name.includes('Male') || 
        v.name.includes('男') || 
        v.name.includes('Ichiro')
      ) || jaVoices[0] || null;
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }
    loadVoices();

    function speak(text, onEndCallback = null) {
      if (!text) return;
      if (synth.speaking) synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';

      if (maleVoice) utterance.voice = maleVoice;
      utterance.pitch = 0.85;
      utterance.rate = 0.95;

      if (onEndCallback) utterance.onend = onEndCallback;
      synth.speak(utterance);
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // 設定画面からのメディア読み込み関数
    async function prepareMediaData(index, prefix) {
      const imgFile = document.getElementById(`${prefix}-img-file`).files[0];
      const videoFile = document.getElementById(`${prefix}-video-file`).files[0];
      const ytUrl = document.getElementById(`${prefix}-url`).value.trim();

      if (imgFile) {
        mediaData[index] = { type: 'image', src: URL.createObjectURL(imgFile) };
      } else if (videoFile) {
        mediaData[index] = { type: 'video', src: URL.createObjectURL(videoFile) };
      } else if (ytUrl) {
        const ytId = extractYouTubeId(ytUrl);
        if (ytId) {
          mediaData[index] = { type: 'youtube', src: ytId };
        } else {
          mediaData[index] = { type: null, src: null };
        }
      } else {
        mediaData[index] = { type: null, src: null };
      }
    }

    // 各選択肢枠（.option-box）の中身を組み立て
    function renderOptionBox(boxElem, text, media) {
      boxElem.innerHTML = "";
      
      if (media.type === 'image') {
        const img = document.createElement('img');
        img.src = media.src;
        img.className = 'option-media-preview';
        boxElem.appendChild(img);
      } else if (media.type === 'video') {
        const video = document.createElement('video');
        video.src = media.src;
        video.className = 'option-media-preview';
        video.muted = true;
        video.autoplay = true;
        video.loop = true;
        video.playsInline = true;
        boxElem.appendChild(video);
      } else if (media.type === 'youtube') {
        const img = document.createElement('img');
        img.src = `https://img.youtube.com/vi/${media.src}/hqdefault.jpg`;
        img.className = 'option-media-preview';
        boxElem.appendChild(img);
      }

      const label = document.createElement('span');
      label.innerText = text;
      boxElem.appendChild(label);
    }

    async function initCameraAndStart() {
      options[0] = document.getElementById('left-text').value.trim() || '選択肢 1';
      options[1] = document.getElementById('center-text').value.trim() || '選択肢 2';
      options[2] = document.getElementById('right-text').value.trim() || '選択肢 3';

      await prepareMediaData(0, 'left');
      await prepareMediaData(1, 'center');
      await prepareMediaData(2, 'right');

      renderOptionBox(document.getElementById('box-left'), options[0], mediaData[0]);
      renderOptionBox(document.getElementById('box-center'), options[1], mediaData[1]);
      renderOptionBox(document.getElementById('box-right'), options[2], mediaData[2]);

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('selection-screen').style.display = 'block';

      const statusMsg = document.getElementById('status-msg');
      statusMsg.innerText = "カメラ準備中...";
      canSelect = false;

      const videoElement = document.getElementById('input-video');
      const previewElement = document.getElementById('camera-preview');

      try {
        const faceMesh = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onFaceMeshResults);

        const camera = new Camera(videoElement, {
          onFrame: async () => {
            if (!isSelected) {
              await faceMesh.send({ image: videoElement });
            }
          },
          width: 320,
          height: 240
        });

        await camera.start();
        previewElement.srcObject = videoElement.srcObject;

        statusMsg.innerText = "カメラ接続完了。しばらくお待ちください...";

        // 5秒待機
        setTimeout(() => {
          statusMsg.innerText = "使い方のアナウンス中...";
          const guideText = "画面の枠が順番に読み上げられます。選びたい項目が光った時に口を少し開けてください。";

          speak(guideText, () => {
            statusMsg.innerText = "まもなく開始します...";

            // 説明終了後 2秒待機してスタート
            setTimeout(() => {
              canSelect = true;
              statusMsg.innerText = "口を開けて選択できます";
              startSelectionLoop();
            }, 2000);
          });
        }, 5000);

      } catch (err) {
        console.error(err);
        statusMsg.innerText = "カメラが起動できません。画面タップ/スペースキーで決定できます";
        statusMsg.style.color = "#ff3b30";
      }
    }

    function onFaceMeshResults(results) {
      const previewElement = document.getElementById('camera-preview');
      const statusMsg = document.getElementById('status-msg');

      if (isSelected || !results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        previewElement.classList.remove('mouth-open-detected');
        return;
      }

      const landmarks = results.multiFaceLandmarks[0];

      const upperLip = landmarks[13];
      const lowerLip = landmarks[14];
      const topHead = landmarks[10];
      const chin = landmarks[152];

      const mouthDistance = Math.hypot(upperLip.x - lowerLip.x, upperLip.y - lowerLip.y);
      const faceHeight = Math.hypot(topHead.x - chin.x, topHead.y - chin.y);
      const mouthRatio = mouthDistance / faceHeight;

      if (mouthRatio > 0.025) {
        previewElement.classList.add('mouth-open-detected');
        if (canSelect) {
          statusMsg.innerText = "口あけ検知中！";
          statusMsg.style.color = "#ff3b30";
          triggerSelection();
        }
      } else {
        previewElement.classList.remove('mouth-open-detected');
        if (canSelect && !isSelected) {
          statusMsg.innerText = "口を少し（約1cm）開けると決定されます";
          statusMsg.style.color = "#00ffcc";
        }
      }
    }

    function startSelectionLoop() {
      isSelected = false;
      currentIndex = 0;

      const boxes = [
        document.getElementById('box-left'),
        document.getElementById('box-center'),
        document.getElementById('box-right')
      ];

      boxes.forEach(b => b.classList.remove('selected'));
      updateHighlightAndSpeak();

      intervalId = setInterval(() => {
        currentIndex = (currentIndex + 1) % 3;
        updateHighlightAndSpeak();
      }, 3000);
    }

    function updateHighlightAndSpeak() {
      if (isSelected) return;

      const boxes = [
        document.getElementById('box-left'),
        document.getElementById('box-center'),
        document.getElementById('box-right')
      ];

      boxes.forEach((box, idx) => {
        if (idx === currentIndex) {
          box.classList.add('active');
          speak(options[idx]);
        } else {
          box.classList.remove('active');
        }
      });
    }

    function triggerSelection() {
      if (isSelected || !canSelect) return;
      isSelected = true;

      clearInterval(intervalId);
      intervalId = null;

      const boxes = [
        document.getElementById('box-left'),
        document.getElementById('box-center'),
        document.getElementById('box-right')
      ];

      boxes.forEach(b => b.classList.remove('active'));

      const selectedBox = boxes[currentIndex];
      const selectedText = options[currentIndex];
      const media = mediaData[currentIndex];

      selectedBox.classList.add('selected');

      setTimeout(() => {
        speak(selectedText + " が選択されました");
        document.getElementById('result-text').innerText = "「" + selectedText + "」 を選択しました";
        
        const wrapper = document.getElementById('media-wrapper');
        wrapper.innerHTML = "";

        if (media.type === 'image') {
          const img = document.createElement('img');
          img.src = media.src;
          wrapper.appendChild(img);
          wrapper.style.display = 'flex';
        } else if (media.type === 'video') {
          const video = document.createElement('video');
          video.src = media.src;
          video.controls = true;
          video.autoplay = true;
          video.loop = true;
          wrapper.appendChild(video);
          wrapper.style.display = 'flex';
        } else if (media.type === 'youtube') {
          const iframe = document.createElement('iframe');
          iframe.src = `https://www.youtube.com/embed/${media.src}?autoplay=1&rel=0`;
          iframe.allow = "autoplay; encrypted-media";
          iframe.allowFullscreen = true;
          wrapper.appendChild(iframe);
          wrapper.style.display = 'flex';
        } else {
          wrapper.style.display = 'none';
        }

        document.getElementById('result-screen').style.display = 'flex';
      }, 800);
    }

    function resetApp() {
      if (synth.speaking) synth.cancel();
      isSelected = false;
      canSelect = false;

      const wrapper = document.getElementById('media-wrapper');
      wrapper.innerHTML = "";
      wrapper.style.display = 'none';

      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('selection-screen').style.display = 'none';
      document.getElementById('setup-screen').style.display = 'flex';
    }

    document.getElementById('selection-screen').addEventListener('click', () => {
      if (canSelect) triggerSelection();
    });
    window.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'Enter') && canSelect) {
        triggerSelection();
      }
    });
  </script>
</body>
</html>
