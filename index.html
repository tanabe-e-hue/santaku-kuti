<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3択自動読み上げ選択ツール（口あけ高感度版）</title>

  <!-- MediaPipe Face Mesh ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
    }

    /* 1. 設定画面 */
    #setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
    }
    .input-container {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      width: 90%;
      max-width: 950px;
    }
    .input-box {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .input-box label {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }
    .input-box textarea {
      height: 120px;
      font-size: 1.1rem;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      resize: none;
    }
    .start-btn {
      padding: 15px 40px;
      font-size: 1.4rem;
      font-weight: bold;
      color: white;
      background-color: #007aff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* 2. 選択画面 */
    #selection-screen {
      display: none;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    .split-area {
      display: flex;
      width: 100%;
      height: 100%;
    }
    .one-third {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px dashed #ccc;
      background-color: #ffffff;
    }
    .one-third:last-child {
      border-right: none;
    }

    /* 横並び3つの枠サイズ（横 260px × 縦 220px） */
    .option-box {
      width: 260px;
      height: 220px;
      max-width: 90%;
      max-height: 85%;
      border: 4px solid #ccc;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      font-size: 1.6rem;
      font-weight: bold;
      color: #333;
      background-color: #fafafa;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: all 0.2s ease-in-out;
      word-break: break-all;
    }

    /* 交互フォーカス（オレンジ） */
    .option-box.active {
      border: 8px solid #ff9500;
      background-color: #fff3e0;
      box-shadow: 0 0 20px rgba(255, 149, 0, 0.6);
      transform: scale(1.03);
    }

    /* 決定完了（緑色） */
    .option-box.selected {
      border: 10px solid #34c759 !important;
      background-color: #e8f5e9 !important;
      color: #1b5e20 !important;
      box-shadow: 0 0 25px rgba(52, 199, 89, 0.8) !important;
      transform: scale(1.05);
    }

    /* カメラプレビュー */
    #camera-preview {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 180px;
      height: 135px;
      border-radius: 8px;
      border: 3px solid #007aff;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 10;
      background: #000;
    }

    /* 状態インジケーター */
    #status-msg {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: bold;
      z-index: 10;
      text-align: center;
    }

    /* 3. 決定完了画面 */
    #result-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #result-text {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 30px;
      text-align: center;
      padding: 0 20px;
    }
    .reset-btn {
      padding: 12px 30px;
      font-size: 1.2rem;
      background-color: #34c759;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 非表示のビデオ要素 -->
  <video id="input-video" style="display:none;" playsinline muted></video>

  <!-- 1. 設定画面 -->
  <div id="setup-screen">
    <h1 style="margin-bottom: 20px;">3択の内容を設定してください</h1>
    <div class="input-container">
      <div class="input-box">
        <label for="left-text">左側の文章 (選択肢 1)</label>
        <textarea id="left-text" placeholder="例: お茶">お茶</textarea>
      </div>
      <div class="input-box">
        <label for="center-text">中央の文章 (選択肢 2)</label>
        <textarea id="center-text" placeholder="例: お水">お水</textarea>
      </div>
      <div class="input-box">
        <label for="right-text">右側の文章 (選択肢 3)</label>
        <textarea id="right-text" placeholder="例: ジュース">ジュース</textarea>
      </div>
    </div>
    <button class="start-btn" onclick="initCameraAndStart()">カメラ起動 & 口あけ選択スタート</button>
  </div>

  <!-- 2. 選択画面 -->
  <div id="selection-screen">
    <div id="status-msg">カメラ初期化中...</div>
    <div class="split-area">
      <div class="one-third">
        <div id="box-left" class="option-box"></div>
      </div>
      <div class="one-third">
        <div id="box-center" class="option-box"></div>
      </div>
      <div class="one-third">
        <div id="box-right" class="option-box"></div>
      </div>
    </div>
    <video id="camera-preview" autoplay playsinline muted></video>
  </div>

  <!-- 3. 決定完了画面 -->
  <div id="result-screen">
    <div id="result-text"></div>
    <button class="reset-btn" onclick="resetApp()">もう一度設定する</button>
  </div>

  <script>
    let options = ["", "", ""];
    let currentIndex = 0;
    let intervalId = null;
    let isSelected = false;

    const synth = window.speechSynthesis;
    let maleVoice = null;

    // 優しい男性の声を探す関数
    function loadVoices() {
      const voices = synth.getVoices();
      const jaVoices = voices.filter(v => v.lang.includes('ja'));

      maleVoice = jaVoices.find(v => 
        v.name.includes('Keita') || 
        v.name.includes('Male') || 
        v.name.includes('男') || 
        v.name.includes('Ichiro')
      ) || jaVoices[0] || null;
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }
    loadVoices();

    function speak(text) {
      if (!text) return;
      if (synth.speaking) synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';

      if (maleVoice) {
        utterance.voice = maleVoice;
      }

      utterance.pitch = 0.85;
      utterance.rate = 0.95;

      synth.speak(utterance);
    }

    async function initCameraAndStart() {
      options[0] = document.getElementById('left-text').value.trim() || '選択肢 1';
      options[1] = document.getElementById('center-text').value.trim() || '選択肢 2';
      options[2] = document.getElementById('right-text').value.trim() || '選択肢 3';

      document.getElementById('box-left').innerText = options[0];
      document.getElementById('box-center').innerText = options[1];
      document.getElementById('box-right').innerText = options[2];

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('selection-screen').style.display = 'block';

      const statusMsg = document.getElementById('status-msg');
      statusMsg.innerText = "カメラ起動中...";

      const videoElement = document.getElementById('input-video');
      const previewElement = document.getElementById('camera-preview');

      try {
        const faceMesh = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onFaceMeshResults);

        const camera = new Camera(videoElement, {
          onFrame: async () => {
            if (!isSelected) {
              await faceMesh.send({ image: videoElement });
            }
          },
          width: 320,
          height: 240
        });

        await camera.start();
        previewElement.srcObject = videoElement.srcObject;

        statusMsg.innerText = "口を少し（約1cm）開けると決定されます";
        startSelectionLoop();

      } catch (err) {
        console.error(err);
        statusMsg.innerText = "カメラが起動できません。画面タップ/スペースキーで決定できます";
        statusMsg.style.color = "#ff3b30";
      }
    }

    // 高感度な口あけ判定処理
    function onFaceMeshResults(results) {
      if (isSelected || !results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        return;
      }

      const landmarks = results.multiFaceLandmarks[0];

      // 13: 上唇中央, 14: 下唇中央, 10: 額上部, 152: 顎先端
      const upperLip = landmarks[13];
      const lowerLip = landmarks[14];
      const topHead = landmarks[10];
      const chin = landmarks[152];

      const mouthDistance = Math.hypot(upperLip.x - lowerLip.x, upperLip.y - lowerLip.y);
      const faceHeight = Math.hypot(topHead.x - chin.x, topHead.y - chin.y);

      const mouthRatio = mouthDistance / faceHeight;

      // 【感度アップ調整】ほんの少し（1cm程度）開けた状態（しきい値: 0.025）で検知
      if (mouthRatio > 0.025) {
        triggerSelection();
      }
    }

    function startSelectionLoop() {
      isSelected = false;
      currentIndex = 0;

      const boxes = [
        document.getElementById('box-left'),
        document.getElementById('box-center'),
        document.getElementById('box-right')
      ];

      boxes.forEach(b => b.classList.remove('selected'));

      updateHighlightAndSpeak();

      intervalId = setInterval(() => {
        currentIndex = (currentIndex + 1) % 3; // 0 -> 1 -> 2 -> 0 と巡回
        updateHighlightAndSpeak();
      }, 3000);
    }

    function updateHighlightAndSpeak() {
      if (isSelected) return;

      const boxes = [
        document.getElementById('box-left'),
        document.getElementById('box-center'),
        document.getElementById('box-right')
      ];

      boxes.forEach((box, idx) => {
        if (idx === currentIndex) {
          box.classList.add('active');
          speak(options[idx]);
        } else {
          box.classList.remove('active');
        }
      });
    }

    function triggerSelection() {
      if (isSelected) return;
      isSelected = true;

      clearInterval(intervalId);
      intervalId = null;

      const boxes = [
        document.getElementById('box-left'),
        document.getElementById('box-center'),
        document.getElementById('box-right')
      ];

      boxes.forEach(b => b.classList.remove('active'));

      const selectedBox = boxes[currentIndex];
      const selectedText = options[currentIndex];

      selectedBox.classList.add('selected');

      setTimeout(() => {
        speak(selectedText + " が選択されました");
        document.getElementById('result-text').innerText = "「" + selectedText + "」 を選択しました";
        document.getElementById('result-screen').style.display = 'flex';
      }, 800);
    }

    function resetApp() {
      if (synth.speaking) synth.cancel();
      isSelected = false;
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('selection-screen').style.display = 'none';
      document.getElementById('setup-screen').style.display = 'flex';
    }

    // バックアップ操作（画面タップ・スペースキー）
    document.getElementById('selection-screen').addEventListener('click', triggerSelection);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') triggerSelection();
    });
  </script>
</body>
</html>
